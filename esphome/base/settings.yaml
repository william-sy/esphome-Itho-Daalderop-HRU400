# Unit settings via Modbus: register 45001 + 2 * setting index (see service_app/modbus-settings-map.md).
# Writable ones are number entities under Configuration; min/max come from the Service-app catalog (sw 8).
# Writing is at your own risk: the unit may not range-check Modbus writes.
# Installer/hidden settings are disabled by default. Fractional settings use `multiply`.
# Read-only: address/baud/parity/master (lockout risk), 32-bit settings (low word only), zone valve calibration.

number:
  - name: ${h_5000}
    address: 5000
    value_type: U_WORD
    register_type: holding
    platform: modbus_controller
    modbus_controller_id: ${modbus_id_slow}
    entity_category: config
    disabled_by_default: true
    min_value: 200
    max_value: 600
    step: 1
    mode: box
    use_write_multiple: true
