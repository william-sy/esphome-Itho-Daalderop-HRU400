# All settings mirrored at 45001 + 2*index. Read-only. Generated from the Service-app catalog (sw 8).
# Scale factors for fractional settings are inferred from catalog defaults; check them against the app.
# 32-bit settings (#44-47, #57-59) only read the low word here.
