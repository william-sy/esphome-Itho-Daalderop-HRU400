###
# Modbus Settings
###
modbus:
  id:                     modbuswtw
  uart_id:                uart_modbus
  turnaround_time:        50ms

modbus_controller:
  - id:                   wtw
    address:              0x48 # Resolves to 72
    modbus_id:            modbuswtw
    setup_priority:       -10
    #update_interval:      15s
    #offline_skip_updates: 100
  # Second controller on the same device for the slow advanced sensors (replaces skip_updates)
  - id:                   wtw_slow
    address:              0x48 # Resolves to 72
    modbus_id:            modbuswtw
    setup_priority:       -10
    update_interval:      300s
  # Third controller for the error counters (was skip_updates: errors, 10 x 60 s)
  - id:                   wtw_errors
    address:              0x48 # Resolves to 72
    modbus_id:            modbuswtw
    setup_priority:       -10
    update_interval:      600s

###
# Substitutions
###
substitutions:
  modbus_id:              wtw
  modbus_id_slow:         wtw_slow
  modbus_id_errors:       wtw_errors
  alert_icon:             mdi:alert-circle
  max:
    error_number:         5
    flap:                 550
    cap:                  399
  fan:
    speed_1:              100
    speed_2:              150
    speed_3:              200
    speed_4:              250
    speed_5:              300
    speed_6:              350
    speed_7:              399

button:
  - platform: restart
    name: "Reset the ESP"
