# Undocumented registers found by read-only scanning (2026-10-30). Not in the manual.
# Wire address = manual number - 40001.
sensor:
  # App settings mirror: register 45001 + 2 * setting index (even registers read 0).
  # Matched against the Service-app: #0 maximumCapacity, #1 Ingeregeld debiet toevoer, #2-#4 stand 1-3 %.
  - name: "maximumCapacity (#0)"
    address: 5000
    value_type: U_WORD
    register_type: holding
    state_class: measurement
    platform: modbus_controller
    modbus_controller_id: ${modbus_id}
  - name: "Set flow supply (#1)"
    address: 5002
    value_type: U_WORD
    register_type: holding
    state_class: measurement
    platform: modbus_controller
    modbus_controller_id: ${modbus_id}
  - name: "Ventilation % level 1 (#2)"
    address: 5004
    value_type: U_WORD
    register_type: holding
    state_class: measurement
    platform: modbus_controller
    modbus_controller_id: ${modbus_id}
  - name: "Ventilation % level 2 (#3)"
    address: 5006
    value_type: U_WORD
    register_type: holding
    state_class: measurement
    platform: modbus_controller
    modbus_controller_id: ${modbus_id}
  - name: "Ventilation % level 3 (#4)"
    address: 5008
    value_type: U_WORD
    register_type: holding
    state_class: measurement
    platform: modbus_controller
    modbus_controller_id: ${modbus_id}

text_sensor:
  # 40105-40110: serial number as ASCII, e.g. WT4231290080
  - name: "Serial number (text)"
    address: 104
    register_count: 6
    response_size: 12
    raw_encode: NONE
    register_type: holding
    platform: modbus_controller
    modbus_controller_id: ${modbus_id_slow}

number:
  # WRITE TEST (one register only): stand 1 ventilation %, setting #2, range 15-50 per the app.
  # Remove this block after the test. Note the original value (50) first and restore it afterwards.
  - name: "WRITE TEST Ventilation % level 1 (#2)"
    address: 5004
    value_type: U_WORD
    register_type: holding
    min_value: 15
    max_value: 50
    step: 1
    platform: modbus_controller
    modbus_controller_id: ${modbus_id_slow}
    use_write_multiple: true
